# Example Nginx snippet for simple API-key protection.
# This is a starting point for the first secure deployment milestone.

map $http_authorization $mcp_api_key_valid {
    default 0;
    "Bearer REPLACE_WITH_STRONG_SECRET" 1;
}

server {
    listen 443 ssl http2;
    server_name justwatch-mcp.example.com;

    ssl_certificate /var/lib/acme/justwatch-mcp.example.com/fullchain.pem;
    ssl_certificate_key /var/lib/acme/justwatch-mcp.example.com/key.pem;

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location /mcp {
        if ($mcp_api_key_valid = 0) {
            return 401;
        }

        proxy_pass http://127.0.0.1:8000/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
